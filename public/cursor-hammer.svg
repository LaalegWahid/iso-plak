<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Hammer cursor. Hotspot: centre of the striking face, (14, 4). -->
  <g id="hammer">
    <!-- handle: cream halo, charcoal outline, gold grip -->
    <path d="M20 10 L5 25" stroke="#f5f4f0" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M20 10 L5 25" stroke="#1f1f1f" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M19 11 L5 25" stroke="#ebb739" stroke-width="3.5" stroke-linecap="round"/>
    <!-- head: cream halo then charcoal steel, with a claw notch -->
    <g transform="rotate(45 20 10)">
      <rect x="11.5" y="6.5" width="17" height="7" rx="1.2" fill="#1f1f1f" stroke="#f5f4f0" stroke-width="1.6"/>
      <rect x="11.5" y="6.5" width="3" height="7" rx="0.8" fill="#4a4a4a"/>
      <path d="M28.5 10 L25.5 10" stroke="#f5f4f0" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
